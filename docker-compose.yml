name: biblioteca

# SQL Server 2022 para la demo de Biblioteca (Autores y Libros).
# Mac con chip Apple (M1/M2/M3): la imagen es amd64 y se ejecuta emulada.
# En Docker Desktop activa: Settings > General > "Use Rosetta for x86_64/amd64 emulation".
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: biblioteca-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Biblioteca_2026"   # solo para desarrollo local
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./db:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  sqlserver-data:
